<style>
:root {
  --bg: #f6f7f5; --card: #ffffff; --fg: #1c2421; --muted: #5f6b65; --line: #dde3df;
  --pri: #1f6f4a; --pri-fg: #ffffff; --pri-soft: #e4f1ea;
  --ok: #1b7f43; --okbg: #e3f4e8; --bad: #b3261e; --badbg: #fbe6e4;
  --warn: #7a5200; --warnbg: #fff3d6; --new: #7b8a83;
  --nav-h: 60px; --fs: 17px;
}
html[data-theme="dark"] {
  --bg: #121614; --card: #1c211f; --fg: #e8ece9; --muted: #9aa6a0; --line: #313a36;
  --pri: #4cae80; --pri-fg: #0b1a12; --pri-soft: #1d2e25;
  --ok: #5fcf8a; --okbg: #17301f; --bad: #ff8a80; --badbg: #3a1d1b;
  --warn: #f0c36a; --warnbg: #3a2f14; --new: #8a9892;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #121614; --card: #1c211f; --fg: #e8ece9; --muted: #9aa6a0; --line: #313a36;
    --pri: #4cae80; --pri-fg: #0b1a12; --pri-soft: #1d2e25;
    --ok: #5fcf8a; --okbg: #17301f; --bad: #ff8a80; --badbg: #3a1d1b;
    --warn: #f0c36a; --warnbg: #3a2f14; --new: #8a9892;
  }
}
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
/* wyłącza gest „ściągnij w dół, aby odświeżyć” (Android/Chrome), który przerywał sesję */
html, body { overscroll-behavior-y: none; }
html.fs-s { --fs: 15px; } html.fs-l { --fs: 19px; } html.fs-xl { --fs: 21px; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4; min-height: 100vh; min-height: 100dvh;
}
#view { max-width: 780px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 150px + env(safe-area-inset-bottom)); }
h1 { font-size: 1.45rem; margin: .2rem 0 .3rem; }
h2 { font-size: 1.1rem; margin: 1.4rem 0 .6rem; }
h3 { font-size: 1rem; margin: 0 0 .5rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0 0 12px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 0 0 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; }
.stat span { color: var(--muted); font-size: .82rem; }
.good { color: var(--ok); } .badc { color: var(--bad); }

/* nawigacja */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
#nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: var(--nav-h); color: var(--muted); text-decoration: none; font-size: .72rem;
}
#nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#nav a.on { color: var(--pri); font-weight: 650; }
@media (min-width: 760px) {
  body { display: flex; flex-direction: column; }
  #nav { position: sticky; top: 0; bottom: auto; order: -1; border-top: 0; border-bottom: 1px solid var(--line); justify-content: center; padding-bottom: 0; }
  #nav a { flex: 0 0 auto; flex-direction: row; gap: 8px; padding: 0 22px; height: 52px; font-size: .95rem; }
  #nav svg { width: 20px; height: 20px; }
  #view { width: 100%; padding-bottom: 170px; }
}

/* przyciski */
.btn {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 12px; padding: 11px 16px; min-height: 46px; cursor: pointer; font-weight: 600;
}
.btn:hover { border-color: var(--pri); }
.btn.pri { background: var(--pri); color: var(--pri-fg); border-color: var(--pri); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns .btn { flex: 1 1 auto; }

/* tryby nauki */
.mode {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0 0 10px; cursor: pointer;
}
.mode:hover { border-color: var(--pri); }
.mode[disabled] { opacity: .5; cursor: default; }
.mode .t { flex: 1; } .mode .t b { display: block; } .mode .t span { color: var(--muted); font-size: .85rem; }
.mode .n { font-weight: 700; color: var(--pri); font-size: 1.1rem; }
.mode.rec { border-color: var(--pri); background: var(--pri-soft); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
select, input[type=number], input[type=search], input[type=text] {
  font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; min-height: 42px;
}
input[type=search] { width: 100%; }

/* pasek */
.bar { display: flex; height: 12px; border-radius: 7px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.c-mastered { background: var(--ok); } .c-learning { background: #e0a526; } .c-hard { background: var(--bad); } .c-new { background: var(--new); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .85rem; color: var(--muted); }
.legend b { color: var(--fg); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: baseline; }

/* pytanie */
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.qhead .no { font-weight: 700; }
.qhead .sp { flex: 1; }
.tally { font-variant-numeric: tabular-nums; font-size: .9rem; }
.prog { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
.prog i { display: block; height: 100%; background: var(--pri); }
.qtext { font-size: 1.1rem; font-weight: 600; margin: 0 0 14px; white-space: pre-line; overflow-wrap: anywhere; }
.opt {
  display: flex; gap: 12px; width: 100%; text-align: left; align-items: flex-start; font: inherit; color: inherit;
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--pri); }
.opt .let {
  flex: 0 0 auto; width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--line); font-weight: 700; text-transform: uppercase;
}
.opt .txt { flex: 1; white-space: pre-line; overflow-wrap: anywhere; line-height: 1.4; padding-top: 3px; }
.opt .mk { flex: 0 0 auto; font-weight: 800; padding-top: 3px; }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--ok); background: var(--okbg); }
.opt.ok .let { background: var(--ok); color: var(--pri-fg); }
.opt.ok .mk { color: var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--badbg); }
.opt.bad .let { background: var(--bad); color: #fff; }
.opt.bad .mk { color: var(--bad); }
.opt.dim { opacity: .55; }
.opt.sel { border-color: var(--pri); }

.fb {
  position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);
  background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 8px;
  box-shadow: 0 6px 22px rgba(0,0,0,.14); z-index: 5;
}
@media (min-width: 760px) { .fb { bottom: 12px; } }
.fb.ok { border-color: var(--ok); } .fb.bad { border-color: var(--bad); } .fb.info { border-color: var(--warn); }
.fb .msg { font-weight: 700; margin-bottom: 8px; }
.fb.ok .msg { color: var(--ok); } .fb.bad .msg { color: var(--bad); } .fb.info .msg { color: var(--warn); }
.expl { background: var(--pri-soft); border-radius: 12px; padding: 12px 14px; margin: 4px 0 10px; white-space: pre-line; }
.expl h3 { margin-bottom: 4px; }
.note { background: var(--warnbg); color: var(--fg); border-radius: 12px; padding: 10px 14px; margin: 4px 0 10px; font-size: .92rem; }
.kbd { font-size: .8rem; color: var(--muted); margin-top: 10px; }
@media (max-width: 759px) { .kbd { display: none; } }

/* listy */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 20px; padding: 6px 12px; cursor: pointer; }
.chip.on { background: var(--pri); color: var(--pri-fg); border-color: var(--pri); }
.qrow {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; font: inherit; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; cursor: pointer;
}
.qrow:hover { border-color: var(--pri); }
.qrow .id { flex: 0 0 2.6rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.qrow .tx { flex: 1; overflow-wrap: anywhere; }
.qrow .tx small { display: block; color: var(--muted); margin-top: 2px; }
.tag { font-size: .75rem; border-radius: 10px; padding: 2px 8px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.tag.mastered { color: var(--ok); border-color: var(--ok); } .tag.hard { color: var(--bad); border-color: var(--bad); }
.tag.learning { color: var(--warn); border-color: var(--warn); }

/* sekcja „Błędne odpowiedzi z ostatniej sesji” na ekranie głównym */
.rvhead { display: flex; align-items: center; gap: 10px; }
.rvhead h2 { flex: 1; margin: 0; font-size: 1.05rem; }
.rvx { min-height: 36px; padding: 4px 12px; }
.rvlist { max-height: 42vh; overflow-y: auto; overscroll-behavior: contain; margin-top: 8px; }
.rvlist .qrow:last-child { margin-bottom: 0; }
.qrow.done { opacity: .5; }

svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 15px; }
svg.chart .gl line { stroke: var(--line); }
svg.chart .bars rect { fill: var(--line); }
svg.chart .ln { fill: none; stroke: var(--pri); stroke-width: 2.5; stroke-linejoin: round; }
svg.chart .pt { fill: var(--pri); stroke: var(--card); stroke-width: 2; }

/* toast i modal */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 24px); max-width: 520px; }
#toast .t { pointer-events: auto; background: #26302b; color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.3); display: flex; gap: 14px; align-items: center; }
#toast .t button { font: inherit; font-weight: 700; color: #9be3bc; background: none; border: 0; cursor: pointer; padding: 4px; }
#toast .t.alert { background: #c62828; border: 2px solid #fff; padding: 14px 16px; font-weight: 600; box-shadow: 0 8px 28px rgba(0,0,0,.45); }
#toast .t.alert span { flex: 1; }
#toast .t.alert button { color: #c62828; background: #fff; border-radius: 10px; padding: 9px 14px; min-height: 40px; }
#toast .t.alert button.x { color: #fff; background: transparent; padding: 4px 8px; min-height: 0; }
.mback { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: grid; place-items: center; padding: 16px; }
.mbox { background: var(--card); color: var(--fg); border-radius: 16px; padding: 18px; max-width: 460px; width: 100%; max-height: 90vh; overflow: auto; }
.mbody { margin: 0 0 14px; white-space: pre-line; }
.mbtns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.hidden { display: none !important; }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t td, table.t th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-weight: 600; font-size: .8rem; }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: var(--pri-soft); }
table.t td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }

.kh { font-weight: 400; opacity: .7; }
@media (max-width: 759px) { .kh { display: none; } }

</style>
</head>

iosków o ukaranie, a jedynie popierać akty oskarżenia złożone przez uprawnionego oskarżyciela", "b": "w sprawach o wykroczenia przeciwko środowisku organom Inspekcji Ochrony Środowiska przysługuje uprawnienie oskarżyciela publicznego także wtedy, gdy wniosek o ukaranie za wykroczenie złożył inny uprawniony oskarżyciel", "c": "w przypadku stwierdzenia nieprawidłowości w zakresie wydawania przez organy ochrony środowiska decyzji ustalających warunki korzystania ze środowiska organ Inspekcji Ochrony Środowiska niezwłocznie wszczyna śledztwo w sprawie"}, "poprawna": "b", "komentarz": "art. 14 ustawy o IOŚ"}, {"id": 45, "pytanie": "Z domniemaniem faktycznym mamy do czynienia:", "odpowiedzi": {"a": "gdy przepis prawa nakazuje przyjmowanie faktów za stwierdzone", "b": "gdy założenia dowodowe zaprzeczają faktom stwierdzonym", "c": "gdy z istnienia określonych faktów wnioskuje się o innych faktach"}, "poprawna": "c", "komentarz": "art. 231 Kodeksu postępowania cywilnego (domniemanie faktyczne); prezentacja z kursu: „05. Zabezpieczanie i pozyskiwanie materiału dowodowego cz. I”, sl. 20."}, {"id": 46, "pytanie": "Świadkami nie mogą być:", "odpowiedzi": {"a": "osoby niezdolne do spostrzegania lub komunikowania swych spostrzeżeń", "b": "duchowni co do faktów dotyczących tajemnicy skarbowej", "c": "funkcjonariusze KAS, ITD oraz UTK zaangażowani w zwalczanie przestępczości środowiskowej"}, "poprawna": "a", "komentarz": "najlepsza z opcji; por. art. 178 i art. 192 § 2 KPK; prezentacja z kursu: „28. Postępowanie administracyjne cz. III i cz. IV”, sl. 81 (kto nie może być świadkiem); „05. Zabezpieczanie i pozyskiwanie materiału dowodowego cz. I”, sl. 31."}, {"id": 47, "pytanie": "W razie stwierdzenia nieprawidłowości w działaniach organów administracji publicznej w zakresie ochrony środowiska organ IOŚ może:", "odpowiedzi": {"a": "skierować wystąpienie o wyjaśnienie przyczyn nieprawidłowości lub o ich usunięcie lub zwrócić się o wszczęcie postępowania administracyjnego, wnieść skargę h", "c": "przepisów międzynarodowej konwencji dotyczącej drogowego przewozu towarów i ładunków niebezpiecznych nie stosuje się do odpadów stanowiących towary niebezpieczne w rozumieniu ustawy z dnia 19 sierpnia 2011 r. o przewozie towarów niebezpiecznych"}, "poprawna": "b", "komentarz": "§ 2 rozporządzenia MŚ z 7.10.2016 w sprawie transportu odpadów"}, {"id": 59, "pytanie": "Organami ochrony środowiska są:", "odpowiedzi": {"a": "wójt, burmistrz lub prezydent miasta; starosta; sejmik województwa; marszałek województwa; wojewoda; minister właściwy do spraw klimatu; Generalny Dyrektor Ochrony Środowiska; regionalny dyrektor ochrony środowiska", "b": "wójt, burmistrz lub prezydent miasta; starosta; sejmik województwa; marszałek województwa; wojewoda; minister właściwy do spraw klimatu; Generalny Dyrektor Ochrony Środowiska; Prezes Państwowej Agencji Atomistyki", "c": "wójt, burmistrz lub prezydent miasta; starosta, sejmik województwa; marszałek województwa; wojewoda; minister właściwy do spraw klimatu; Generalny Dyrektor Ochrony Środowiska; regionalny dyrektor ochrony środowiska, Instytut Ochrony Środowiska - Państwowy Instytut Badawczy"}, "poprawna": "a", "komentarz": "art. 376 POŚ"}, {"id": 60, "pytanie": "Czy wszystkie organy ochrony środowiska mają uprawnienia do prowadzenia kontroli przestrzegania i stosowania przepisów o ochronie środowiska:", "odpowiedzi": {"a": "tak", "b": "nie", "c": "wyłącznie minister właściwy do spraw klimatu, marszałek województwa, starosta oraz wójt, burmistrz lub prezydent miasta sprawują kontrolę przestrzegania i stosowania przepisów o ochronie środowiska w zakresie objętym właściwością tych organów oraz organy Inspekcji Ochrony Środowiska działające na podstawie przepisów ustawy o Inspekcji Ochrony Środowiska wykonują zadania w zakresie ochrony środowiska, jeżeli ustawa tak stanowi"}, "poprawna": "c", "komentarz": "art. 376 i art. 379 ust. 1 POŚ"}, {"id": 61, "pytanie": "Wójt, burmistrz lub prezydent miasta, starosta, marszałek województwa lub minister właściwy do spraw klimatu występują do wojewódzkiego inspektora ochrony środowiska o podjęcie odpowiednich działań będących w jego kompetencji, jeżeli:", "odpowiedzi": {"a": "zawsze gdy wpłynie do nich wniosek o interwencję", "b": "w wyniku kontroli organy te stwierdzą naruszenie przez kontrolowany podmiot przepisów o ochronie środowiska lub występuje uzasadnione podejrzenie, że takie naruszenie mogło nastąpić, przekazując dokumentację sprawy", "c": "nie występują do wojewódzkiego inspektora ochrony środowiska, ponieważ mają uprawnienia kontrolne i sami podejmują działania"}, "poprawna": "b", "komentarz": "art. 379 ust. 5 POŚ"}, {"id": 62, "pytanie": "Organami administracji publicznej są:", "odpowiedzi": {"a": "ministrowie, centralne organy administracji rządowej, wojewodowie oraz działające w ich imieniu lub we własnym inne organy administracji rządowej (zespolonej i niezespolonej), organy jednostek samorządu terytorialnego oraz organy i podmioty, które są powołane z mocy prawa lub na podstawie porozumień do rozstrzygania spraw indywidualnych w drodze decyzji administracyjnych", "b": "nie są określone", "c": "wyłącznie organy jednostek samorządu terytorialnego"}, "poprawna": "a", "komentarz": "art. 5 § 2 pkt 3 KPA"}, {"id": 63, "pytanie": "Do realizacji jakich zadań powołana jest Inspekcja Ochrony Środowiska:", "odpowiedzi": {"a": "do kontroli odpowiedzialności za zapobieganie szkodom w środowisku i naprawę szkód w środowisku", "b": "do kontroli przestrzegania przepisów o ochronie środowiska oraz badania i oceny stanu środowiska", "c": "do współdziałania z organizatorami i innymi służbami w ochronie porządku podczas zgromadzeń i imprez publicznych"}, "poprawna": "b", "komentarz": "art. 1 ustawy o IOŚ"}, {"id": 64, "pytanie": "Organami Inspekcji Ochrony Środowiska są:", "odpowiedzi": {"a": "Główny Inspektor Ochrony Środowiska", "b": "wojewódzki inspektor ochrony środowiska jako organ rządowej administracji zespolonej w województwie", "c": "odpowiedź a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "art. 3 ustawy o IOŚ"}, {"id": 65, "pytanie": "Główny Inspektor Ochrony Środowiska jest:", "odpowiedzi": {"a": "organem samorządowym", "b": "centralnym organem administracji rządowej nadzorowanym przez ministra właściwego do spraw klimatu", "c": "jednostką pomocniczą gminy"}, "poprawna": "b", "komentarz": "art. 3a ustawy o IOŚ"}, {"id": 66, "pytanie": "Które z zadań należą do właściwości Inspekcji Ochrony Środowiska?", "odpowiedzi": {"a": "kontrola podmiotów korzystających ze środowiska w rozumieniu ustawy Prawo ochrony środowiska", "b": "wydawanie decyzji ustalających warunki korzystania ze środowiska", "c": "wydawanie decyzji o przywróceniu środowiska do właściwego stanu"}, "poprawna": "a", "komentarz": "art. 2 ust. 1 pkt 1 ustawy o IOŚ"}, {"id": 67, "pytanie": "Inspektor Inspekcji Ochrony Środowiska przy wykonywaniu kontroli uprawniony jest między innymi do:", "odpowiedzi": {"a": "oceny sposobu eksploatacji instalacji lub urządzeń, wstępu przez całą dobę na teren kontrolowanej nieruchomości, środka transportu, na teren niezwiązany z prowadzeniem działalności gospodarczej, określenia składu morfologicznego odpadów, zatrzymania osoby podejrzanej o popełnienie czynu zabronionego, żądania wstrzymania ruchu instalacji", "b": "oceny sposobu eksploatacji instalacji lub urządzeń, wstępu przez całą dobę na teren kontrolowanej nieruchomości, obiektu lub jego części, na którym prowadzona jest działalność gospodarcza, do środka transportu, na teren niezwiązany z prowadzeniem działalności gospodarczej, określenia składu morfologicznego odpadów w oparciu o wiedzę ekspercką, żądania wstrzymania ruchu lub uruchomienia instalacji", "c": "oceny sposobu eksploatacji instalacji lub urządzeń, wstępu przez całą dobę wyłącznie na teren kontrolowanej nieruchomości, określenia składu morfologicznego odpadów, zatrzymania osoby podejrzanej o popełnienie czynu zabronionego, żądania wstrzymania ruchu instalacji"}, "poprawna": "b", "komentarz": "art. 9 ust. 2 pkt 1, 3 i 10 ustawy o IOŚ"}, {"id": 68, "pytanie": "Co jest celem oględzin", "odpowiedzi": {"a": "spisanie oświadczeń osób biorących udział w oględzinach", "b": "obiektywna rekonstrukcja przebiegu zdarzenia i zabezpieczenie rzeczowego materiału dowodowego", "c": "domniemanie na podstawie przedstawionej dokumentacji fotograficznej stanu faktycznego"}, "poprawna": "b", "komentarz": "eliminacja opcji oczywiście błędnych; prezentacja z kursu: „07. Metodologia prowadzenia oględzin”, sl. 8."}, {"id": 69, "pytanie": "Ile i jakie są zasady prowadzenia oględzin", "odpowiedzi": {"a": "są 4 podstawowe zasad prowadzenia oględzin\n1) zasada ustnego ustalenia\n2) zasada pośredniości\n3) zasada wieloosobowego kierownictwa\n4) zasada podejmowania działań w wolnej chwili", "b": "jest 12 podstawowych zasad prowadzenia oględzin\n1) zasada bezpośredniości\n2) zasada wszechstronności i dokładności\n3) zasada obiektywizmu\n4) zasada planowości\n5) zasada indywidualności\n6) zasada szybkości\n7) zasada zachowania wartości dowodowej śladów i przeciwdziałania kontaminacji\n8) zasada pisemności\n9) zasada ekonomiczności\n10) zasada tajności\n11) zasada przestrzegania wymogów bezpieczeństwa i higieny pracy\n12) zasada jednoosobowego kierownictwa", "c": "nie są określone zasady prowadzenia oględzin"}, "poprawna": "b", "komentarz": "potwierdzenie pośrednie: materiały Policji „Zasady i sposoby prowadzenia oględzin” wymieniają 10 z 12 zasad; opcje a i c oczywiście błędne; prezentacja z kursu: „07. Metodologia prowadzenia oględzin”, sl. 20–28 (12 zasad prowadzenia oględzin)."}, {"id": 70, "pytanie": "Ile jest i jakie są najważniejsze zasady sporządzania protokołu oględzin", "odpowiedzi": {"a": "są 3 najważniejsze zasady sporządzania protokołu oględzin\n1) zasada kolejności wykonywania czynności oględzinowych\n2) zasada stosowania odrębności protokołu oględzin od pozostałej dokumentacji\n3) zasada zawierania wniosków i przypuszczeń w podsumowującej części protokołu", "b": "nie są określone zasady sporządzania protokołu oględzin", "c": "jest 9 najważniejszych zasad sporządzania protokołu oględzin\n1) zasada komunikatywności\n2) zasada stosowania odpowiednich form gramatycznych\n3) zasada dokładności\n4) zasada zwięzłości opisu\n5) zasada bezpośredniości\n6) zasada obiektywizmu\n7) zasada zgodności dokumentacyjnej\n8) zasada jednolitego nazewnictwa\n9) zasada systematyczności"}, "poprawna": "c", "komentarz": "materiały Policji „Zasady sporządzania protokołu oględzin” – 9 zasad; prezentacja z kursu: „07. Metodologia prowadzenia oględzin”, sl. 35–42 (zasady sporządzania protokołu oględzin)."}, {"id": 71, "pytanie": "Z ilu i jakich części składa się protokół oględzin", "odpowiedzi": {"a": "protokół oględzin składa się z 3 części\n1) wstępnej\n2) wniosków\n3) faktów i okoliczności, które nie mają znaczenia dla przedmiotu oględzin", "b": "nie można wyodrębnić żadnych części protokołu oględzin", "c": "protokół oględzin składa się z 3 części\n1) wstępnej\n2) opisowej\n3) końcowej"}, "poprawna": "c", "komentarz": "eliminacja opcji oczywiście błędnych; prezentacja z kursu: „07. Metodologia prowadzenia oględzin”, sl. 43."}, {"id": 72, "pytanie": "Ile i jakie są metody dokonywania oględzin rozumianych jako taktyka postępowania na miejscu zdarzenia:", "odpowiedzi": {"a": "wyróżnić można 2 metody dokonywania oględzin rozumianych jako taktyka postępowania na miejscu zdarzenia:\n1) metodę obiektywną\n2) metodę subiektywną", "b": "nie są określone metody dokonywania oględzin dotyczące taktyki postępowania na miejscu zdarzenia", "c": "naprzemienne stosowanie metody obiektywnej i subiektywnej w miejscu poddanym oględzinom"}, "poprawna": "a", "komentarz": "materiały Policji „Zasady i sposoby prowadzenia oględzin” – metoda obiektywna i subiektywna; prezentacja z kursu: „07. Metodologia prowadzenia oględzin”, sl. 52."}, {"id": 73, "pytanie": "Kiedy osoba wezwana na przesłuchanie może odmówić składania zeznań:", "odpowiedzi": {"a": "jeśli jest osobą najbliższą dla oskarżonego (np. małżonkiem, rodzicem, dzieckiem, osobą pozostającą we wspólnym pożyciu lub w stosunku przysposobienia)", "b": "jeżeli odpowiedź mogłaby narazić przesłuchiwanego lub osobę dla niej najbliższą na odpowiedzialność za przestępstwo lub przestępstwo skarbowe", "c": "odpowiedz a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "art. 182 § 1 i art. 183 § 1 KPK"}, {"id": 74, "pytanie": "Czy i kiedy należy zapoznać przesłuchiwanego z protokołem przesłuchania", "odpowiedzi": {"a": "tylko wtedy gdy w ocenie prowadzącego przesłuchanie przesłuchiwany zeznał coś ważnego", "b": "na wyraźne żądanie przesłuchiwanego", "c": "przed podpisaniem protokołu przesłuchania"}, "poprawna": "c", "komentarz": "art. 150 § 1 KPK; ISK 5.1.2"}, {"id": 75, "pytanie": "Czy z przeprowadzonego przesłuchania należy sporządzić protokół", "odpowiedzi": {"a": "nie", "b": "tak", "c": "decyzja o tym czy sporządzany jest protokół należy do prowadzącego przesłuchanie"}, "poprawna": "b", "komentarz": "art. 148 § 1 KPK"}, {"id": 76, "pytanie": "Tożsamość przesłuchiwanego inspektor Inspekcji Ochrony Środowiska ustalana na podstawie:", "odpowiedzi": {"a": "odebrania ustnej informacji od przesłuchiwanego", "b": "dowodu osobistego lub innego dokumentu pozwalającego na wiarygodne ustalenie tożsamości", "c": "informacji zamieszczonych w mediach społecznościowych"}, "poprawna": "b", "komentarz": "wzór protokołu przesłuchania (ISK)"}, {"id": 77, "pytanie": "Przesłuchiwanego o odpowiedzialności karnej za zatajenie prawdy należy uprzedzić:", "odpowiedzi": {"a": "w trakcie swobodnej wypowiedzi przesłuchiwanego", "b": "przed rozpoczęciem przesłuchania", "c": "w fazie prowadzenia czynności końcowych"}, "poprawna": "b", "komentarz": "art. 190 § 1 KPK"}, {"id": 78, "pytanie": "Przesłuchiwanemu należy umożliwić swobodną wypowiedź jeśli:", "odpowiedzi": {"a": "odpowiada na zadawane pytania", "b": "udaje, że nie rozumie zadawanych pytań", "c": "zawsze, nawet jeśli nie pamięta zdarzenia, które jest przedmiotem przesłuchania"}, "poprawna": "c", "komentarz": "art. 171 § 1 KPK"}, {"id": 79, "pytanie": "Jaki organ prowadzi nadzór w zakresie programów ochrony powietrza oraz planów działań krótkoterminowych", "odpowiedzi": {"a": "wojewoda przy pomocy wojewódzkiego inspektora ochrony środowiska", "b": "Wójt, burmistrz lub prezydent miasta, starosta lub marszałek województwa", "c": "minister właściwy do spraw klimatu"}, "poprawna": "a", "komentarz": "art. 96a ust. 1 POŚ"}, {"id": 80, "pytanie": "Co to jest instalacja w rozumieniu ustawy z dnia 27 kwietnia 2001 r. - Prawo ochrony środowiska", "odpowiedzi": {"a": "instalacji to stacjonarne urządzenie techniczne, zespół stacjonarnych urządzeń technicznych powiązanych technologicznie, do których tytułem prawnym dysponuje ten sam podmiot i położonych na terenie jednego zakładu, budowle niebędące urządzeniami technicznymi ani ich zespołami, których eksploatacja może spowodować emisję", "b": "ustawa Prawo ochrony środowiska nie określa definicji instalacji", "c": "instalacja to stacjonarne urządzenie techniczne zespół stacjonarnych urządzeń technicznych powiązanych technologicznie, do których tytułem prawnym dysponują różne podmioty, budowle niebędące urządzeniami technicznymi ani ich zespołami, których eksploatacja może spowodować emisję"}, "poprawna": "a", "komentarz": "art. 3 pkt 6 POŚ"}, {"id": 81, "pytanie": "Eksploatacja instalacji lub urządzenia w rozumieniu ustawy z dnia 27 kwietnia 2001 r. - Prawo ochrony środowiska", "odpowiedzi": {"a": "powinna powodować przekroczenie standardów emisyjnych", "b": "nie powinna powodować przekroczenia standardów emisyjnych", "c": "może powodować przekroczenie standardów emisyjnych"}, "poprawna": "b", "komentarz": "art. 141 ust. 1 POŚ"}, {"id": 82, "pytanie": "Jaki organ może nałożyć na podmiot obowiązek utworzenia stanowiska pomiarowego na emitorze zwanego potocznie króćcem pomiarowym:", "odpowiedzi": {"a": "wojewódzki inspektor ochrony środowiska", "b": "organ ochrony środowiska", "c": "Główny Inspektor Ochrony Środowiska"}, "poprawna": "b", "komentarz": "eliminacja opcji oczywiście błędnych; art. 150 ust. 1 POŚ – dodatkowe obowiązki pomiarowe może nałożyć organ ochrony środowiska (przepisu wprost o stanowisku pomiarowym brak); prezentacja z kursu: „32. Powietrze cz. II”, sl. 37 (miejsce stanowiska pomiarowego wyznacza organ wydający pozwolenie)."}, {"id": 83, "pytanie": "Co oznacza skrót LCP i MCP w rozumieniu obiektów energetycznego spalania paliw", "odpowiedzi": {"a": "LCP - duże obiekty energetycznego spalania paliw o nominalne mocy cieplnej dostarczonej w paliwie powyżej 50 MW, MCP - średnie obiekty energetycznego spalania paliw o nominalnej mocy nominalnej cieplnej dostarczonej w paliwie od 1 do 50 MW", "b": "źródła emisji z silosów do magazynowania materiałów sypkich", "c": "źródła emisji opalane ekogroszkiem w zabudowie jednorodzinnej"}, "poprawna": "a", "komentarz": "LCP i MCP to skróty z dyrektyw 2010/75/UE (duże obiekty energetycznego spalania) i (UE) 2015/2193 (średnie obiekty energetycznego spalania); polskie rozporządzenie pomiarowe tych skrótów nie używa; prezentacja z kursu: „31. Powietrze cz. I”, sl. 69, 73, 75."}, {"id": 84, "pytanie": "Inspekcja Ochrony Środowiska podejmuje kontrole podmiotu w zakresie emisji hałasu jeżeli:", "odpowiedzi": {"a": "podmiot posiada decyzję o dopuszczalnym poziomie hałasu lub poziom ten został określony w pozwoleniu zintegrowanym", "b": "podmiot nie posiada decyzji o dopuszczalnym poziomie hałasu", "c": "podmiot nie posiada decyzji o dopuszczalnym poziomie hałasu, ale organ ochrony środowiska prowadzi postepowanie celem jego wydania"}, "poprawna": "a", "komentarz": "potwierdzenie pośrednie: art. 115a POŚ, lista kontrolna ISK 1.2.4; eliminacja opcji oczywiście błędnych; prezentacja z kursu: „35. Hałas”, sl. 29."}, {"id": 85, "pytanie": "Dopuszczalny poziom hałasu wyrażony wskaźnikami hałasu LAeq D (dla pory dnia) i LAeq N (dla pory nocy) określony jest:", "odpowiedzi": {"a": "tylko w pozwoleniu zintegrowanym", "b": "tylko w decyzji o dopuszczalnym poziomie hałasu", "c": "w pozwoleniu zintegrowanym lub w decyzji o dopuszczalnym poziomie hałasu"}, "poprawna": "c", "komentarz": "art. 115a ust. 3 POŚ; § 8 ust. 1–2 rozporządzenia MKiŚ w sprawie wymagań w zakresie prowadzenia pomiarów wielkości emisji"}, {"id": 86, "pytanie": "Zgodnie z ustawą Prawo ochrony środowiska, w przypadku stwierdzenia przez organ ochrony środowiska, na podstawie pomiarów własnych, lub pomiarów podmiotu obowiązanego do ich prowadzenia, że poza zakładem, w wyniku jego działalności, przekroczone są dopuszczalne poziomy hałasu, organ ten:", "odpowiedzi": {"a": "wstrzymuje działalność zakładu", "b": "wydaje zalecenie pokontrolne", "c": "wydaje decyzję o dopuszczalnym poziomie hałasu"}, "poprawna": "c", "komentarz": "art. 115a ust. 1 POŚ"}, {"id": 87, "pytanie": "Okresowy pomiar hałasu, który jest wyrażony wskaźnikami hałasu mającymi zastosowanie do ustalania i kontroli warunków korzystania ze środowiska (LAeq D i LAeq N), prowadzi się:", "odpowiedzi": {"a": "dla zakładu, na którego terenie są eksploatowane instalacje lub urządzenia emitujące hałas, dla którego została wydana decyzja o dopuszczalnym poziomie hałasu lub dla instalacji, dla której zostało wydane pozwolenie zintegrowane", "b": "raz na dwa lata, z uwzględnieniem specyfiki pracy źródeł hałasu. W przypadku źródeł hałasu pracujących sezonowo pomiary hałasu przeprowadza się w tym okresie", "c": "odpowiedz a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "§ 8 ust. 1–3 rozporządzenia MKiŚ w sprawie wymagań w zakresie prowadzenia pomiarów wielkości emisji"}, {"id": 88, "pytanie": "Jaki organ wydaje decyzję o dopuszczalnym poziomie hałasu do środowiska", "odpowiedzi": {"a": "Wojewódzki Inspektor Ochrony Środowiska", "b": "Generalny Dyrektor Ochrony Środowiska", "c": "właściwy organ ochrony środowiska"}, "poprawna": "c", "komentarz": "art. 115a ust. 1 POŚ"}, {"id": 89, "pytanie": "W decyzji ustalającej wymiar kary biegnącej określa się:", "odpowiedzi": {"a": "wielkość stwierdzonego przekroczenia lub naruszenia odpowiednio w skali doby albo godziny, wymiar kary biegnącej", "b": "termin, od którego kara biegnąca będzie naliczana, jako odpowiednio dzień albo pełną godzinę zakończenia wykonania pomiarów, pobrania próbek albo dokonania innych ustaleń stanowiących podstawę stwierdzenia przekroczenia lub naruszenia", "c": "odpowiedź a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "art. 300 ust. 4 POŚ"}, {"id": 90, "pytanie": "Jaka ustawa reguluje obowiązki pomiarowe dla prowadzących instalację oraz użytkowników urządzenia emitującego pola elektromagnetyczne w środowisku ogólnym?", "odpowiedzi": {"a": "ustawa o udostępnianiu informacji o środowisku i jego ochronie, udziale społeczeństwa w ochronie środowiska oraz o ocenach oddziaływania na środowisko", "b": "ustawa Prawo ochrony środowiska", "c": "ustawa o systemie zarządzania emisjami gazów cieplarnianych i innych substancji"}, "poprawna": "b", "komentarz": "art. 122a POŚ"}, {"id": 91, "pytanie": "Instalacje emitujące pola elektromagnetyczne podlegają:", "odpowiedzi": {"a": "uzyskaniu pozwolenia zintegrowanego", "b": "decyzji o dopuszczalnym poziomie emitującym pola elektromagnetyczne", "c": "zgłoszeniu organowi ochrony środowiska"}, "poprawna": "c", "komentarz": "art. 152 ust. 1 POŚ"}, {"id": 92, "pytanie": "Prowadzący instalację oraz użytkownik urządzenia emitującego pola elektromagnetyczne zobowiązany jest do wykonywania pomiarów poziomów pól elektromagnetycznych", "odpowiedzi": {"a": "bezpośrednio przed rozpoczęciem użytkowania instalacji lub urządzenia; każdorazowo w przypadku zmiany warunków pracy instalacji lub urządzenia, w tym zmiany spowodowane zmianami w wyposażeniu instalacji lub urządzenia, o ile zmiany te mogą mieć wpływ na zmianę poziomów pól elektromagnetycznych, których źródłem jest instalacja lub urządzenie; każdorazowo w przypadku zmiany istniejącego stanu zagospodarowania i zabudowy nieruchomości skutkującej zmianami w występowaniu miejsc dostępnych dla ludności w otoczeniu instalacji lub urządzenia - na pisemny wniosek właściciela lub zarządcy nieruchomości, na której nastąpiła ta zmiana", "b": "przed likwidacją urządzenia emitującego pola elektromagnetyczne", "c": "okresowo tzn. pomiary poziomów pól elektromagnetycznych prowadzi się dwa razy w roku, raz w sezonie zimowym (październik-marzec) oraz raz w sezonie letnim (kwiecień-wrzesień)"}, "poprawna": "a", "komentarz": "art. 122a ust. 1 POŚ"}, {"id": 93, "pytanie": "Zadania realizowane przez wojewódzkiego inspektora ochrony środowiska w zakresie pól elektromagnetycznych obejmują:", "odpowiedzi": {"a": "ocena poziomów pól elektromagnetycznych w środowisku i obserwacja zmian w ramach Państwowego Monitoringu Środowiska", "b": "prowadzenie kontroli w terenie i ocena wyników pomiarów przedkładanych przez podmioty", "c": "prowadzenie wykazu obowiązujących pozwoleń wydanych dla stacji bazowych telefonii komórkowych (tzw. pozwolenia radiowe, uprawniające do używania urządzeń radiowych w lokalizacji i z parametrami określonymi w danym pozwoleniu radiowym)"}, "poprawna": "b", "komentarz": "art. 29i ust. 2 ustawy o wspieraniu rozwoju usług i sieci telekomunikacyjnych; art. 122a POŚ"}, {"id": 94, "pytanie": "W Systemie Informacyjnym o Instalacjach wytwarzających Promieniowanie Elektro Magnetyczne SI2PEM są gromadzone m.in. dane o wynikach pomiarów wykonywanych przez:", "odpowiedzi": {"a": "przedsiębiorcy telekomunikacyjni prowadzący instalacje emitujące pola elektromagnetyczne lub będący użytkownikami takich instalacji lub planujący nowe instalacje emitujące pole elektromagnetyczne; akredytowane laboratoria Prezes UKE; organy Inspekcji Ochrony Środowiska; organy inspekcji sanitarnej,", "b": "organy ochrony środowiska, podmioty prowadzące pomiary pola elektromagnetycznego wykonywane przez akredytowane laboratoria", "c": "odpowiedź a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "art. 29h ustawy o wspieraniu rozwoju usług i sieci telekomunikacyjnych"}, {"id": 95, "pytanie": "Kto zgodnie z art. 147 ustawy z dnia 27 kwietnia 2001 r. Prawo ochrony środowiska zobowiązany jest do wykonywania okresowych pomiarów wielkości emisji", "odpowiedzi": {"a": "prowadzący instalację oraz użytkownik urządzenia", "b": "Główny Inspektorat Ochrony Środowiska", "c": "Wojewódzkie Inspektoraty Ochrony Środowiska"}, "poprawna": "a", "komentarz": "art. 147 ust. 1 POŚ"}, {"id": 96, "pytanie": "Ocenie w ramach kontroli dokumentacyjnych automonitoringowych podlegają wyniki pomiarów i badania przedkładane przez podmioty do tego zobowiązane tj.:", "odpowiedzi": {"a": "pomiary i badania\n1) emisji pyłów i gazów do powietrza\n2) jakości i ilości odprowadzanych ścieków\n3) ilości pobieranej wody\n4) poziomu hałasu emitowanego do środowiska\n5) poziomu pól elektromagnetycznych w środowisku\n6) stanu środowiska w obszarze oddziaływania różnych obiektów (np. składowiska odpadów, stacje i bazy paliw)", "b": "pomiary na potrzeby uzyskania decyzji wydawanych przez organy ochrony środowiska", "c": "Inspekcja Ochrony Środowiska nie ocenia wyników i badań przedkładanych przez podmioty"}, "poprawna": "a", "komentarz": "ISK 5.3"}, {"id": 97, "pytanie": "W jakim przypadku inspektor Inspekcji Ochrony Środowiska może odstąpić od sporządzenia adnotacji z kontroli dokumentacyjnej automonitoringowej:", "odpowiedzi": {"a": "w przypadku gdy na podstawie przeprowadzonej analizy stwierdzi naruszenie warunków emisji w stosunku do posiadanej decyzji organu ochrony środowiska określającej warunki korzystania ze środowiska", "b": "wyłącznie w przypadku podjęcia decyzji o przeprowadzeniu kontroli w terenie, wówczas prowadzona analiza dokumentacji traktowana jest jako przygotowanie do tej kontroli", "c": "nie ma takiej możliwości"}, "poprawna": "b", "komentarz": "ISK 5.3"}, {"id": 98, "pytanie": "Czy wyniki pomiarów w związku z emisją gazów i pyłów do powietrza z eksploatacji instalacji lub urządzenia w wyniku monitorowania procesów technologicznych przekazywane są do WIOŚ:", "odpowiedzi": {"a": "dla wszystkich instalacji, na które został nałożony obowiązek ich prowadzenia", "b": "dla wszystkich urządzeń, na które został nałożony obowiązek ich prowadzenia", "c": "odpowiedź a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "§ 2 ust. 1 rozporządzenia MKiŚ z 15.12.2020 (Dz.U. poz. 2405)"}, {"id": 99, "pytanie": "Z jaką częstotliwością eksploatujący instalację lub urządzenie przedkłada wynik pomiarów okresowych wykonywanych częściej niż jeden raz w miesiącu w związku z emisją gazów i pyłów do powietrza:", "odpowiedzi": {"a": "w ciągu 15 dni od dnia zakończenia kwartału, w którym pomiary zostały wykonane", "b": "w ciągu 7 dni od dnia zakończenia kwartału, w którym pomiary zostały wykonane", "c": "w ciągu 30 dni od dnia zakończenia kwartału, w którym pomiary zostały wykonane"}, "poprawna": "c", "komentarz": "§ 7 pkt 2 rozporządzenia MKiŚ z 15.12.2020 (Dz.U. poz. 2405)"}, {"id": 100, "pytanie": "Z jaką częstotliwością eksploatujący instalację lub urządzenie przedkłada wynik pomiarów ciągłych w związku z emisją gazów i pyłów do powietrza:", "odpowiedzi": {"a": "za I półrocze w ciągu 30 dni od dnia zakończenia półrocza, w którym pomiary zostały wykonane", "b": "za rok kalendarzowy – do dnia 31 stycznia roku następującego po roku kalendarzowym, w którym pomiary zostały wykonane", "c": "odpowiedź a i b jest prawidłowa"}, "poprawna": "c", "komentarz": "§ 7 pkt 1 rozporządzenia MKiŚ z 15.12.2020 (Dz.U. poz. 2405)"}, {"id": 101, "pytanie": "Z kontroli dokumentacyjnej sporządza się:", "odpowiedzi": {"a": "notatkę służbową", "b": "adnotację z kontroli dokumentacyjnej", "c": "protokół"}, "poprawna": "b", "komentarz": "ISK 5.3"}, {"id": 102, "pytanie": "W jakim przypadku służby celne mogą zwrócić się do WIOŚ z prośbą o opinię:", "odpowiedzi": {"a": "w przypadku gdy służby celne zatrzymają do kontroli przewożone produkty w celu ustalenia czy zatrzymane do kontroli celnej produkty spełniają wymagania określone w ustawie z dnia 24 kwietnia 2009 r. o bateriach i akumulatorach", "b": "w przypadku gdy służby celne przewożą produkty niewiadomego pochodzenia", "c": "w przypadku gdy służby celne wytworzą w wyniku swojej działalności zużyte baterie i akumulatory"}, "poprawna": "a", "komentarz": "ISK 5.3 (zał. I.5.3.4)"}, {"id": 103, "pytanie": "Inspekcja Ochrony Środowiska może wykonywać czynności z użyciem bezzałogowych statków powietrznych:", "odpowiedzi": {"a": "wyłącznie w trakcie wykonywania kontroli przestrzegania wymagań ochrony środowiska", "b": "wyłącznie w trakcie wykonywania czynności o których mowa w art. 10b ust. 2 ustawy o Inspekcji Ochrony Środowiska", "c": "w trakcie wykonywania kontroli przestrzegania wymagań ochrony środowiska oraz wykonywania czynności o których mowa w art. 10b ust. 2 ustawy o Inspekcji Ochrony Środowiska"}, "poprawna": "c", "komentarz": "art. 9 ust. 2 pkt 2 i art. 10b ust. 2 pkt 1 ustawy o IOŚ"}, {"id": 104, "pytanie": "Celem stosowania urządzeń technicznych w pracy IOŚ jest:", "odpowiedzi": {"a": "ułatwienie i usprawnienie wykonywania kontroli przestrzegania wymagań ochrony środowiska oraz wykonywania czynności o których mowa w art. 10b ust. 2 ustawy o Inspekcji Ochrony Środowiska", "b": "podniesienie efektywności kontroli przestrzegania wymagań ochrony środowiska oraz wykonywania czynności o których mowa w art. 10b ust. 2 ustawy o Inspekcji Ochrony Środowiska", "c": "wszystkie odpowiedzi są prawidłowe"}, "poprawna": "c", "komentarz": "wiedza ogólna; prezentacja z kursu: „30b. Stosowanie urządzeń technicznych w pracy IOŚ, w tym rejestracja obrazu, dźwięku cz II”, sl. 19."}, {"id": 105, "pytanie": "Czynności kontrolne prowadzone z użyciem bezzałogowych statków powietrznych mogą być wykonywane bez okazania legitymacji służbowej i poinformowania przedsiębiorcy lub osoby, wobec której podjęto czynności kontrolne, o przysługujących im prawach oraz obowiązkach w trakcie kontroli, tylko wówczas jeśli takie loty wykonywane są gdy operator bezzałogowego statku powietrznego:", "odpowiedzi": {"a": "znajduje się poza terenem, do którego prowadzący działalność posiada tytuł prawny", "b": "znajduje się na terenie, do którego prowadzący działalność posiada tytuł prawny", "c": "wszystkie wskazane odpowiedzi są prawidłowe"}, "poprawna": "a", "komentarz": "art. 49 ust. 3a i 3b Prawa przedsiębiorców (loty BSP bez okazania legitymacji, gdy operator znajduje się poza terenem, do którego przedsiębiorca ma tytuł prawny); prezentacja z kursu: „14. Zasady przeprowadzania kontroli – ogólne cz. IV”, sl. 12."}, {"id": 106, "pytanie": "Loty bezzałogowymi statkami powietrznymi może wykonywać:", "odpowiedzi": {"a": "każdy pracownik Inspekcji Ochrony Środowiska", "b": "pracownik Inspekcji Ochrony Środowiska posiadający stosowne uprawnienia do wykonywania takich lotów", "c": "wyłącznie pracownik będący Inspektorem Inspekcji Ochrony Środowiska"}, "poprawna": "b", "komentarz": "eliminacja opcji oczywiście błędnych; prezentacja z kursu: „14. Zasady przeprowadzania kontroli – ogólne cz. IV”, sl. 12 (art. 49 ust. 3a Pp – loty wykonują pracownicy z uprawnieniami)."}, {"id": 107, "pytanie": "W sprawach o wykroczenia przeciwko środowisku organom Inspekcji Ochrony Środowiska przysługuje uprawnienie oskarżyciela publicznego także wtedy, gdy:", "odpowiedzi": {"a": "wniosek o ukaranie za wykroczenie złożył inny uprawniony oskarżyciel", "b": "wniosek o ukaranie za wykroczenie złoży nieuprawniony oskarżyciel", "c": "akt oskarżenia złoży inny uprawniony oskarżyciel"}, "poprawna": "a", "komentarz": "art. 14 ustawy o IOŚ"}, {"id": 108, "pytanie": "Wojewódzki inspektor ochrony środowiska może zażądać od kierownika kontrolowanej jednostki organizacyjnej:", "odpowiedzi": {"a": "przeprowadzenia postępowania służbowego przeciwko osobom winnym dopuszczenia do uchybień i poinformowania go, w określonym terminie, o wynikach tego postępowania i o podjętych działaniach", "b": "przeprowadzenia postępowania służbowego lub innego przewidzianego prawem postępowania przeciwko osobom winnym dopuszczenia do uchybień i poinformowania go, w określonym terminie, o wynikach tego postępowania i o podjętych działaniach", "c": "przeprowadzenia postępowania służbowego lub innego przewidzianego prawem postępowania przeciwko osobom winnym dopuszczenia do uchybień"}, "poprawna": "b", "komentarz": "art. 12 ust. 3 ustawy o IOŚ"}, {"id": 109, "pytanie": "W razie stwierdzenia, że działanie lub zaniechanie kierownika jednostki organizacyjnej, jej pracownika lub innej osoby fizycznej wyczerpuje znamiona przestępstwa przeciwko środowisku, organy Inspekcji Ochrony Środowiska kierują:", "odpowiedzi": {"a": "do organu powołanego do ścigania przestępstw zawiadomienie o popełnieniu przestępstwa, dołączając dowody dokumentujące podejrzenie", "b": "do organu powołanego do ścigania przestępstw zawiadomienie o popełnieniu przestępstwa bez konieczności dołączania dowodów dokumentujących podejrzenie", "c": "do organu powołanego do ścigania przestępstw wniosek o ukaranie za popełnione przestępstwo, dołączając dowody dokumentujące podejrzenie"}, "poprawna": "a", "komentarz": "art. 15 ustawy o IOŚ"}, {"id": 110, "pytanie": "Adresatem zarządzenia pokontrolnego mogą być:", "odpowiedzi": {"a": "osoba fizyczna lub kierownik kontrolowanej jednostki organizacyjnej", "b": "kontrolowana osoba prawna", "c": "dowolny przedstawiciel kontrolowanego podmiotu korzystającego ze środowiska"}, "poprawna": "a", "komentarz": "art. 12 ust. 1 ustawy o IOŚ"}, {"id": 111, "pytanie": "O stwierdzeniu przekroczenia lub naruszenia na podstawie kontroli wojewódzki inspektor ochrony środowiska, zawiadamia podmiot korzystający ze środowiska, przekazując mu wyniki pomiarów:", "odpowiedzi": {"a": "w terminie 30 dni od wykonania pomiarów", "b": "w terminie 14 dni od wykonania pomiarów", "c": "w terminie 21 dni od wykonania pomiarów"}, "poprawna": "c", "komentarz": "art. 299 ust. 2 POŚ"}, {"id": 112, "pytanie": "Zgodnie z ustawą o postępowaniu egzekucyjnym w administracji środkami egzekucyjnymi obowiązków o charakterze niepieniężnym są:", "odpowiedzi": {"a": "grzywna w celu przymuszenia, wykonanie zastępcze, odebranie rzeczy ruchomej, odebranie nieruchomości (opróżnienie lokalu i innych pomieszczeń) i przymus bezpośredni", "b": "wykonanie zastępcze, odebranie rzeczy ruchomej, odebranie nieruchomości (opróżnienie lokalu i innych pomieszczeń) i przymus bezpośredni", "c": "zabór mienia, wstrzymanie działalności, grzywna w celu przymuszenia i wykonanie zastępcze"}, "poprawna": "a", "komentarz": "art. 1a pkt 12 lit. b ustawy o postępowaniu egzekucyjnym w administracji"}, {"id": 113, "pytanie": "Jeśli cel egzekucji w administracji tego wymaga, organ egzekucyjny może zezwolić na piśmie egzekutorowi na dokonanie czynności egzekucyjnej:", "odpowiedzi": {"a": "w dni wolne od pracy lub w porze nocnej pomiędzy godziną 22 a godziną 9", "b": "w dni pracujące lub w porze nocnej pomiędzy godziną 21 a godziną 7", "c": "w dni wolne od pracy lub w porze nocnej pomiędzy godziną 21 a godziną 7"}, "poprawna": "c", "komentarz": "art. 52 § 1 ustawy o postępowaniu egzekucyjnym w administracji"}, {"id": 114, "pytanie": "Grzywny w celu przymuszenia w postępowaniu egzekucyjnym w administracji nakładane wielokrotnie nie mogą łącznie przekroczyć:", "odpowiedzi": {"a": "w przypadku osób fizycznych kwoty 100 000 zł, a w stosunku do osób prawnych i jednostek organizacyjnych nieposiadających osobowości prawnej kwoty 200 000 zł", "b": "w przypadku osób fizycznych kwoty 50 000 zł, a w stosunku do osób prawnych i jednostek organizacyjnych nieposiadających osobowości prawnej kwoty 200 000 zł", "c": "w przypadku osób fizycznych kwoty 50 000 zł, a w stosunku do osób prawnych i jednostek organizacyjnych nieposiadających osobowości prawnej kwoty 500 000 zł"}, "poprawna": "b", "komentarz": "art. 121 § 3 ustawy o postępowaniu egzekucyjnym w administracji"}, {"id": 115, "pytanie": "Zgodnie z ustawą Prawo ochrony środowiska w razie wystąpienia awarii wojewódzki inspektor ochrony środowiska może w drodze decyzji zarządzić:", "odpowiedzi": {"a": "przeprowadzenie właściwych badań dotyczących przyczyn, przebiegu i skutków awarii oraz wydać zakazy lub ograniczenia w korzystaniu ze środowiska", "b": "przeprowadzenie właściwych działań nadzorczych i wydać zakazy lub ograniczenia w korzystaniu z instalacji", "c": "przeprowadzenie postępowania służbowego wobec pracownika zakładu na terenie którego doszło do awarii oraz wydać zakazy i ograniczenia w poruszaniu się po tym zakładzie"}, "poprawna": "a", "komentarz": "art. 247 ust. 1 POŚ"}, {"id": 116, "pytanie": "Zgodnie z ustawą o odpadach wojewódzki inspektor ochrony środowiska w przypadku gdy posiadacz odpadów zbiera lub przetwarza odpady bez wymaganego zezwolenia na zbieranie odpadów lub zezwolenia na przetwarzanie odpadów:", "odpowiedzi": {"a": "zawiesza, w drodze decyzji, działalność posiadacza odpadów", "b": "wstrzymuje, w drodze postanowienia, działalność posiadacza odpadów", "c": "wstrzymuje, w drodze decyzji, działalność posiadacza odpadów"}, "poprawna": "c", "komentarz": "art. 32 ust. 1a ustawy o odpadach"}, {"id": 117, "pytanie": "Kto uniemożliwia lub utrudnia organowi Inspekcji Ochrony Środowiska przeprowadzenie kontroli podlega:", "odpowiedzi": {"a": "karze pieniężnej w wysokości od 1 000 zł do 10 000 zł", "b": "karze grzywny", "c": "karze pieniężnej w wysokości od 10 000 zł do 100 000 zł"}, "poprawna": "c", "komentarz": "art. 31c ust. 1 ustawy o IOŚ"}, {"id": 118, "pytanie": "Zgodnie z ustawą Prawo ochrony środowiska wojewódzki inspektor ochrony środowiska nie wszczyna postępowania w sprawie wymierzenia kary, jeżeli przewidywana jej wysokość nie przekroczy:", "odpowiedzi": {"a": "500 zł", "b": "800 zł", "c": "100 zł"}, "poprawna": "b", "komentarz": "art. 308 POŚ"}, {"id": 119, "pytanie": "Zgodnie z ustawą o odpadach administracyjną wysokość kary jaką wymierza się za zbieranie odpadów lub przetwarzanie odpadów bez wymaganego zezwolenia wynosi:", "odpowiedzi": {"a": "nie mniej niż 1 000 zł i nie może przekroczyć 1 000 000 zł", "b": "nie mniej niż 10 000 zł i nie może przekroczyć 1 000 000 zł", "c": "nie mniej niż 100 000 zł i nie może przekroczyć 1 000 000 zł"}, "poprawna": "a", "komentarz": "art. 194 ust. 4 ustawy o odpadach"}, {"id": 120, "pytanie": "Zgodnie z ustawą o odpadach administracyjną wysokość kary jaką wymierza się za gospodarowanie odpadami niezgodnie z posiadanym zezwoleniem wynosi:", "odpowiedzi": {"a": "nie mniej niż 1 000 zł i nie może przekroczyć 10 000 zł", "b": "nie mniej niż 10 000 zł i nie może przekroczyć 2 000 000 zł", "c": "nie mniej niż 1 000 zł i nie może przekroczyć 1 000 000 zł"}, "poprawna": "c", "komentarz": "art. 194 ust. 5 ustawy o odpadach"}, {"id": 121, "pytanie": "Zgodnie z ustawą o odpadach administracyjne kary pieniężne wskazane w tej ustawie wymierza w drodze decyzji wojewódzki inspektor ochrony środowiska właściwy ze względu na:", "odpowiedzi": {"a": "miejsce wytwarzania lub gospodarowania odpadami", "b": "siedzibę przedsiębiorcy", "c": "miejsce zamieszkania strony postępowania"}, "poprawna": "a", "komentarz": "art. 196 ustawy o odpadach"}, {"id": 122, "pytanie": "Zgodnie z ustawą o odpadach w decyzji wymierzającej administracyjną karę pieniężną określa się w szczególności:", "odpowiedzi": {"a": "rodzaj naruszenia i dzień stwierdzenia naruszenia", "b": "wysokość administracyjnej kary pieniężnej", "c": "wszystkie wskazane odpowiedzi są prawidłowe"}, "poprawna": "c", "komentarz": "art. 198 ustawy o odpadach"}, {"id": 123, "pytanie": "Policja, na wniosek organu Inspekcji Ochrony Środowiska o udzielenie informacji lub udostępnienie dokumentów i danych związanych z ochroną środowiska, jest obowiązana przekazać te informacje, dokumenty i dane", "odpowiedzi": {"a": "niezwłocznie, nie później jednak niż w terminie 21 dni od dnia złożenia wniosku", "b": "niezwłocznie, nie później jednak niż w terminie 14 dni od dnia złożenia wniosku", "c": "niezwłocznie, nie później jednak niż w terminie 7 dni od dnia złożenia wniosku"}, "poprawna": "b", "komentarz": "art. 16 ust. 2 ustawy o IOŚ"}, {"id": 124, "pytanie": "Wojewódzki Inspektor Ochrony Środowiska wydaje zarządzenie pokontrolne na podstawie:", "odpowiedzi": {"a": "ustaleń kontroli", "b": "ustaleń kontroli innego organu np. marszałka województwa", "c": "informacji pozyskanych w wyniku złożenie wniosku o interwencję"}, "poprawna": "a", "komentarz": "art. 12 ust. 1 ustawy o IOŚ"}, {"id": 125, "pytanie": "Kto wbrew przepisom składuje, usuwa, przetwarza, zbiera, dokonuje odzysku, unieszkodliwia albo transportuje odpady lub substancje w takich warunkach lub w taki sposób, że może to zagrozić życiu lub zdrowiu człowieka lub spowodować obniżenie jakości wody, powietrza lub powierzchni ziemi lub zniszczenie w świecie roślinnym lub zwierzęcym podlega karze pozbawienia wolności:", "odpowiedzi": {"a": "od 6 miesięcy do lat 8", "b": "od roku do lat 10", "c": "do lat 2"}, "poprawna": "b", "komentarz": "art. 183 § 1 KK"}, {"id": 126, "pytanie": "Czynności o których mowa w art. 10b pkt 2 ust 6 ustawy o Inspekcji Ochrony Środowiska tj. dokonywanie oględzin pomieszczeń i innych miejsc dostępnych publicznie, mogą być podejmowane:", "odpowiedzi": {"a": "bez konieczności okazywania legitymacji", "b": "po wcześniejszym zawiadomieniu kontrolowanego", "c": "po okazaniu legitymacji"}, "poprawna": "a", "komentarz": "art. 10b ust. 3 ustawy o IOŚ"}, {"id": 127, "pytanie": "Kto bez wymaganego zgłoszenia lub zezwolenia, albo wbrew jego warunkom przywozi z zagranicy lub wywozi za granicę odpady niebezpieczne, podlega karze pozbawienia wolności", "odpowiedzi": {"a": "od 6 miesięcy do lat 8", "b": "od lat 2 do 12", "c": "od roku do lat 15"}, "poprawna": "b", "komentarz": "art. 183 § 5 KK"}, {"id": 128, "pytanie": "W ochronie środowiska możemy wyróżnić następujące odpowiedzialności:", "odpowiedzi": {"a": "administracyjną i karną", "b": "cywilną, administracyjną i karną", "c": "osobistą, cywilną i administracyjną"}, "poprawna": "b", "komentarz": "wiedza ogólna"}, {"id": 129, "pytanie": "Przestępstwa przeciwko środowisku zostały wskazane w:", "odpowiedzi": {"a": "Kodeksie karnym", "b": "Ustawach administracyjnego prawa materialnego z zakresu ochrony środowiska", "c": "Kodeksie karnym i ustawach administracyjnego prawa materialnego z zakresu ochrony środowiska"}, "poprawna": "c", "komentarz": "wiedza ogólna; prezentacja z kursu: „54. Przestępstwa przeciwko środowisku”, sl. 15, 17."}, {"id": 130, "pytanie": "Zgodnie z Kodeksem wykroczeń karami są:", "odpowiedzi": {"a": "areszt, ograniczenie wolności, grzywna i nagana", "b": "areszt, grzywna i nagana", "c": "areszt, pozbawienie wolności, grzywna i nagana"}, "poprawna": "a", "komentarz": "art. 18 KW"}, {"id": 131, "pytanie": "W stosunku do sprawcy wykroczenia można poprzestać na zastosowaniu:", "odpowiedzi": {"a": "pouczenia, zwróceniu uwagi lub na zastosowaniu innych środków oddziaływania wychowawczego", "b": "zwróceniu uwagi, ostrzeżeniu lub na zastosowaniu innych środków oddziaływania wychowawczego", "c": "pouczenia, zwróceniu uwagi, ostrzeżeniu lub na zastosowaniu innych środków oddziaływania wychowawczego"}, "poprawna": "c", "komentarz": "art. 41 KW"}, {"id": 132, "pytanie": "Karalność wykroczenia ustaje:", "odpowiedzi": {"a": "jeżeli od czasu jego popełnienia upłynął rok; jeżeli w tym okresie wszczęto postępowanie, karalność wykroczenia ustaje z upływem 2 lat od zakończenia tego okres", "b": "jeżeli od czasu jego popełnienia upłynął rok; jeżeli w tym okresie wszczęto postępowanie, karalność wykroczenia ustaje z upływem 10 lat od zakończenia tego okres", "c": "jeżeli od czasu jego popełnienia upłynął 5; jeżeli w tym okresie wszczęto postępowanie, karalność wykroczenia ustaje z upływem 20 lat od zakończenia tego okres"}, "poprawna": "a", "komentarz": "art. 45 § 1 KW"}, {"id": 133, "pytanie": "Uprawniony do uchylenia prawomocnego mandatu karnego jest:", "odpowiedzi": {"a": "sąd właściwy do rozpoznania sprawy, niezależnie od tego czy na jego obszarze działania została nałożona grzywna", "b": "sąd właściwy do rozpoznania sprawy, na którego obszarze działania została nałożona grzywna", "c": "sąd właściwy do rozpoznania sprawy"}, "poprawna": "b", "komentarz": "art. 101 § 2 KPW"}, {"id": 134, "pytanie": "Kodeks postępowania administracyjnego stosujemy:", "odpowiedzi": {"a": "przed organami administracji publicznej w należących do właściwości tych organów sprawach indywidualnych rozstrzyganych w drodze decyzji administracyjnych", "b": "w postępowaniach w sprawach karnych skarbowych", "c": "we wszystkich sprawach uregulowanych w ustawie z dnia 29 sierpnia 1997 r. - Ordynacja podatkowa"}, "poprawna": "a", "komentarz": "art. 1 KPA"}, {"id": 135, "pytanie": "Zgodnie z zasadą praworządności:", "odpowiedzi": {"a": "organy administracji publicznej działają na podstawie przepisów prawa", "b": "organy administracji publicznej działają na podstawie wewnętrznych wytycznych dyrektora departamentu", "c": "organy administracji działają na podstawie wewnętrznych okólników dyrektora generalnego urzędu"}, "poprawna": "a", "komentarz": "art. 6 KPA"}, {"id": 136, "pytanie": "Postępowanie administracyjne jest:", "odpowiedzi": {"a": "jednoinstancyjne", "b": "dwuinstancyjne, chyba że przepis szczególny stanowi inaczej", "c": "trójinstancyjne"}, "poprawna": "b", "komentarz": "art. 15 KPA"}, {"id": 137, "pytanie": "Stronami w postępowaniu administracyjnym mogą być:", "odpowiedzi": {"a": "tylko osoby fizyczne", "b": "tylko osoby prawne", "c": "stronami mogą być osoby fizyczne i osoby prawne"}, "poprawna": "c", "komentarz": "art. 29 KPA"}, {"id": 138, "pytanie": "W postępowaniu administracyjnym:", "odpowiedzi": {"a": "strona może działać przez pełnomocnika, chyba że charakter czynności wymaga jej osobistego działania", "b": "strona nie może działać przez pełnomocnika", "c": "strona musi działać przez pełnomocnika"}, "poprawna": "a", "komentarz": "art. 32 KPA"}, {"id": 139, "pytanie": "W razie uchybienia terminu do wniesienia odwołania, należy przywrócić termin:", "odpowiedzi": {"a": "na prośbę zainteresowanego, jeżeli uprawdopodobni, że uchybienie nastąpiło bez jego winy", "b": "z urzędu, jeżeli organ uprawdopodobni, że uchybienie nastąpiło bez winy zainteresowanego", "c": "na prośbę zainteresowanego lub z urzędy"}, "poprawna": "a", "komentarz": "art. 58 § 1–2 KPA"}, {"id": 140, "pytanie": "W każdym przypadku niezałatwienia sprawy w terminie:", "odpowiedzi": {"a": "organ powinien sporządzić notatkę urzędową", "b": "organ administracji publicznej jest obowiązany zawiadomić strony, podając przyczyny zwłoki, wskazując nowy termin załatwienia sprawy oraz pouczając o prawie do wniesienia ponaglenia", "c": "niezałatwienie sprawy w terminie nie nakłada na organ żadnych obowiązków"}, "poprawna": "b", "komentarz": "art. 36 § 1 KPA"}, {"id": 141, "pytanie": "Strona:", "odpowiedzi": {"a": "ma prawo wglądu w akta sprawy, sporządzania z nich notatek, kopii lub odpisów. Prawo to nie przysługuje po zakończeniu postępowania", "b": "ma prawo wglądu w akta sprawy, sporządzania z nich notatek, kopii lub odpisów. Prawo to przysługuje również po zakończeniu postępowania", "c": "nie ma prawa wglądu w akta sprawy, chyba że organ postanowi inaczej"}, "poprawna": "b", "komentarz": "art. 73 § 1 KPA"}, {"id": 142, "pytanie": "Jeżeli podanie strony nie zawiera podpisu:", "odpowiedzi": {"a": "organ odrzuca podanie", "b": "organ wydaje decyzję odmawiająca żądaniu strony", "c": "organ wzywa wnoszącego podanie do usunięcia braków w wyznaczonym terminie, nie krótszym niż siedem dni, z pouczeniem, że nieusunięcie tych braków spowoduje pozostawienie podania bez rozpoznania"}, "poprawna": "c", "komentarz": "art. 64 § 2 KPA"}, {"id": 143, "pytanie": "Jeżeli organ administracji publicznej, do którego podanie wniesiono, jest niewłaściwy w sprawie:", "odpowiedzi": {"a": "niezwłocznie przekazuje je do organu właściwego, zawiadamiając jednocześnie o tym wnoszącego podanie", "b": "wydaje postanowienie o odmowie wszczęcia postępowania", "c": "zwraca podanie"}, "poprawna": "a", "komentarz": "art. 65 § 1 KPA"}, {"id": 144, "pytanie": "Dowodem w postępowaniu administracyjnym:", "odpowiedzi": {"a": "może być wszystko, co może przyczynić się do wyjaśnienia sprawy, a nie jest sprzeczne z prawem", "b": "tylko opinie biegłych", "c": "tylko zeznania świadków"}, "poprawna": "a", "komentarz": "art. 75 § 1 KPA"}, {"id": 145, "pytanie": "W postępowaniu administracyjnym obowiązek zebrania w sposób wyczerpujący i rozpatrzenia całego materiału dowodowego:", "odpowiedzi": {"a": "spoczywa na organie", "b": "spoczywa na stronie postępowania", "c": "spoczywa na sądzie administracyjnym"}, "poprawna": "a", "komentarz": "art. 77 § 1 KPA"}, {"id": 146, "pytanie": "Gdy postępowanie administracyjne z jakiejkolwiek przyczyny stało się bezprzedmiotowe w całości albo w części, organ administracji publicznej:", "odpowiedzi": {"a": "przekazuje sprawę do sądu powszechnego", "b": "zwraca podanie", "c": "wydaje decyzję o umorzeniu postępowania odpowiednio w całości albo w części"}, "poprawna": "c", "komentarz": "art. 105 § 1 KPA"}, {"id": 147, "pytanie": "Organ administracji publicznej załatwia sprawę przez wydanie:", "odpowiedzi": {"a": "decyzji, chyba że przepisy kodeksu stanowią inaczej", "b": "zawsze postanowienia", "c": "zawsze ugody"}, "poprawna": "a", "komentarz": "art. 104 § 1 KPA"}, {"id": 148, "pytanie": "Od decyzji wydanej w pierwszej instancji służy stronie:", "odpowiedzi": {"a": "odwołanie", "b": "zażalenie", "c": "powództwo do sądu powszechnego"}, "poprawna": "a", "komentarz": "art. 127 § 1 KPA"}, {"id": 149, "pytanie": "Organ odwoławczy stwierdza uchybienie terminu do wniesienia odwołania:", "odpowiedzi": {"a": "w drodze decyzji", "b": "w drodze postanowienia", "c": "w drodze zawiadomienia"}, "poprawna": "b", "komentarz": "art. 134 KPA"}, {"id": 150, "pytanie": "Zażalenie wnosi się w terminie:", "odpowiedzi": {"a": "30 dni od dnia doręczenia postanowienia stronie", "b": "14 dni od dnia doręczenia postanowienia stronie", "c": "7 dni od dni doręczenia postanowienie stronie, a gdy postanowienie zostało ogłoszone ustnie – od dnia jego ogłoszenia stronie"}, "poprawna": "c", "komentarz": "art. 141 § 2 KPA"}, {"id": 151, "pytanie": "Wydanie decyzji administracyjnej bez podstawy prawnej lub z rażącym naruszeniem prawa to podstawa do:", "odpowiedzi": {"a": "wznowienia postępowania", "b": "stwierdzenia nieważności decyzji", "c": "zmiany decyzji ostatecznej"}, "poprawna": "b", "komentarz": "art. 156 § 1 KPA"}, {"id": 152, "pytanie": "Jeżeli koniec terminu przypada na dzień uznany ustawowo za wolny od pracy lub na sobotę:", "odpowiedzi": {"a": "termin upływa tego dnia", "b": "termin upływa w najbliższą niedzielę", "c": "termin upływa następnego dnia, który nie jest dniem wolnym od pracy ani sobotą"}, "poprawna": "c", "komentarz": "art. 57 § 4 KPA"}, {"id": 153, "pytanie": "Jeżeli w czasie wydawania decyzji w sprawie administracyjnej kary pieniężnej obowiązuje ustawa inna niż w czasie naruszenia prawa, w następstwie którego ma być nałożona kara, stosuje się ustawę:", "odpowiedzi": {"a": "nową, jednakże należy stosować ustawę obowiązującą poprzednio, jeżeli jest ona względniejsza dla strony", "b": "surowszą dla strony", "c": "obowiązującą poprzednio, w każdym przypadku"}, "poprawna": "a", "komentarz": "art. 189c KPA"}, {"id": 154, "pytanie": "Zgodnie z KPA administracyjna kara pieniężna nie może zostać nałożona, jeżeli od dnia naruszenia prawa albo wystąpienia skutków naruszenia prawa upłynęło:", "odpowiedzi": {"a": "pięć lat", "b": "trzy lata", "c": "jeden rok"}, "poprawna": "a", "komentarz": "art. 189g § 1 KPA"}, {"id": 155, "pytanie": "W sprawie zakończonej decyzją ostateczną wznawia się postępowanie, jeżeli:", "odpowiedzi": {"a": "decyzja została skierowana do osoby niebędącej stroną w sprawie", "b": "decyzja wydana została z rażącym naruszeniem prawa", "c": "strona bez własnej winy nie brała udziału w postępowaniu"}, "poprawna": "c", "komentarz": "art. 145 § 1 KPA"}, {"id": 156, "pytanie": "Jeżeli przedmiotem postępowania administracyjnego jest nałożenie na stronę obowiązku bą eresowania mediów", "c": "każda informacja o środowisku"}, "poprawna": "a", "komentarz": "art. 1 ust. 1 ustawy o dostępie do informacji publicznej"}, {"id": 167, "pytanie": "Tajemnicą przedsiębiorstwa są informacje:", "odpowiedzi": {"a": "z którymi można się bez przeszkód zapoznać", "b": "informacje techniczne, technologiczne, organizacyjne przedsiębiorstwa lub inne informacje posiadające wartość gospodarczą, które jako całość lub w szczególnym zestawieniu i zbiorze ich elementów nie są powszechnie znane osobom zwykle zajmującym się tym rodzajem informacji albo nie są łatwo dostępne dla takich osób, o ile uprawniony do korzystania z informacji lub rozporządzania nimi podjął, przy zachowaniu należytej staranności, działania w celu utrzymania ich w poufności", "c": "informacje uznane przez przedsiębiorcę za niejawne"}, "poprawna": "b", "komentarz": "art. 11 ust. 2 ustawy o zwalczaniu nieuczciwej konkurencji"}, {"id": 168, "pytanie": "Organ może wyłączyć informację handlową z udostępniania:", "odpowiedzi": {"a": "z urzędu", "b": "na wniosek zainteresowanego", "c": "żadna z powyższych"}, "poprawna": "b", "komentarz": "art. 16 ust. 1 pkt 7 i ust. 3 UIŚ"}, {"id": 169, "pytanie": "Władze publiczne udostępniają informacje o środowisku i jego ochronie:", "odpowiedzi": {"a": "bez względnej zwłoki, nie później niż w ciągu miesiąca od dnia otrzymania wniosku", "b": "bez względnej zwłoki, nie później niż w ciągu czternastu dni od dnia otrzymania wniosku", "c": "w ciągu miesiąca od dnia otrzymania wniosku"}, "poprawna": "a", "komentarz": "art. 14 ust. 1 UIŚ"}, {"id": 170, "pytanie": "Udostępnianie informacji o środowisku i jego ochronie następuje:", "odpowiedzi": {"a": "w sposób i w formie określonych we wniosku", "b": "w sposób określony we wniosku", "c": "w sposób i w formie określonych we wniosku chyba że środki techniczne, którymi dysponują władze publiczne, nie umożliwiają udostępnienia informacji w sposób i w formie określonych we wniosku"}, "poprawna": "c", "komentarz": "a ie kontroli”: „Skan podpisanego protokołu kontroli należy zamieścić w ISK” – bez żadnego warunku (inaczej niż w ISK 5.3 przy adnotacjach z kontroli dokumentacyjnej)"}, {"id": 219, "pytanie": "Wyniki przeprowadzonych w ramach kontroli pomiarów/badań do Informatycznego Systemu Kontroli (ISK) wprowadza:", "odpowiedzi": {"a": "pracownik Centralnego Laboratorium Badawczego GIOŚ wykonujący pomiary/badania", "b": "do ISK nie ma możliwości wprowadzenia wyników pomiarów/badań", "c": "inspektor wykonujący kontrolę"}, "poprawna": "c", "komentarz": "potwierdzenie pośrednie: ISK 1.3.2 – inspektor wprowadza dane dotyczące kontroli do bazy ISK; eliminacja opcji oczywiście błędnych; prezentacja z kursu: „58. Obsługa Informatycznego Systemu Kontroli”, sl. 82 (pośrednio – po zakończeniu kontroli można dodawać wyniki badań z laboratorium)."}, {"id": 220, "pytanie": "W Informatycznym Systemie Kontroli (ISK) inspektor może przyporządkować zakład:", "odpowiedzi": {"a": "do dowolnej liczby grup zakładów", "b": "maksymalnie do jednej grupy zakładów", "c": "maksymalnie do trzech grup zakładów"}, "poprawna": "a", "komentarz": "ISK 2.1"}, {"id": 221, "pytanie": "O zakończeniu kontroli w Informatycznym Systemie Kontroli (ISK) świadczy:", "odpowiedzi": {"a": "wprowadzenie daty zakończenia kontroli", "b": "zmiana statusu kontroli", "c": "wprowadzenie do ISK działań pokontrolnych"}, "poprawna": "b", "komentarz": "potwierdzenie pośrednie: ISK 1.3.2 – status kontroli („zakończona” / „w trakcie realizacji”); eliminacja opcji oczywiście błędnych; prezentacja z kursu: „58. Obsługa Informatycznego Systemu Kontroli”, sl. 82–85 (pośrednio – krok „Kończymy kontrolę”)."}, {"id": 222, "pytanie": "Zakłady dużego ryzyka wystąpienia awarii (ZDR) w Informatycznym Systemie Kontroli (ISK) przypisane są do kategorii wysokiego ryzyka", "odpowiedzi": {"a": "jeżeli wynik analizy wielokryterialnej jest równy bądź większy od 60 punktów", "b": "jeżeli w trakcie ostatniej kontroli w terenie stwierdzono naruszenia klasy 1 – naruszenia w wyniku których nie nastąpiło zagrożenie lub zanieczyszczenie środowiska", "c": "niezależnie od wyniku analizy wielokryterialnej, ponieważ z uwagi na wymogi prawne zakłady te muszą być kontrolowane co roku, niezależnie od wyniku analizy wielokryterialnej"}, "poprawna": "c", "komentarz": "ISK 2.3"}, {"id": 223, "pytanie": "Informatyczny Systemie Kontroli (ISK)", "odpowiedzi": {"a": "umożliwia rejestrację kontrolowanych podmiotów z zachowaniem 2 stopni hierarchii danych: podmiotów kontrolowanych korzystających ze środowiska (pkzś) oraz zakładów", "b": "umożliwia rejestrację kontrolowanych podmiotów bez zachowania hierarchii danych", "c": "umożliwia rejestrację zakładu bez konieczności przypisania go do podmiotu kontrolowanego korzystającego ze środowiska (pkzś)"}, "poprawna": "a", "komentarz": "ISK 2.1"}, {"id": 224, "pytanie": "Taryfikator mandatów w Informatyczny Systemie Kontroli (ISK) dostępny jest z poziomu", "odpowiedzi": {"a": "Rejestru działań pokontrolnych", "b": "Rejestru dokumentów systemu kontroli", "c": "Rejestru kontroli"}, "poprawna": "b", "komentarz": "ISK 1.1 – taryfikator mandatów to rozdział 1 części IV dokumentacji ISK („Dokumentacja dostępna w formie elektronicznej”); dokumentacja ISK jest w systemie dostępna jako Rejestr dokumentów systemu kontroli (zweryfikowane w systemie ISK)"}, {"id": 225, "pytanie": "W rejestrze działań pokontrolnych Informatycznego Systemu Kontroli (ISK) możemy wprowadzić dane dotyczące", "odpowiedzi": {"a": "zarządzeń pokontrolnych", "b": "nałożonych mandatów karnych", "c": "przeprowadzonych instruktaży"}, "poprawna": "a", "komentarz": "w Rejestrze działań pokontrolnych wprowadza się zarządzenia pokontrolne (zweryfikowane w systemie ISK); ISK 6 wymienia zarządzenie pokontrolne wśród działań pokontrolnych"}, {"id": 226, "pytanie": "Inspektor w ramach obsługi Informatycznego Systemu Kontroli (ISK) ma obowiązek", "odpowiedzi": {"a": "wprowadzania danych do bazy ISK o podmiotach, zakładach, kontrolach i działaniach pokontrolnych w przypisanym zakresie w związku z prowadzonymi kontrolami", "b": "sporządzania raportów z wykorzystaniem narzędzi systemowych w tym programu Ocean Gen Rap", "c": "informowania użytkowników ISK na poziomie wioś o wprowadzonych zmianach w informatycznej bazie ISK"}, "poprawna": "a", "komentarz": "ISK 1.3.2 – obowiązki inspektora w ramach obsługi ISK (wprowadzanie danych o podmiotach, zakładach, kontrolach i działaniach pokontrolnych)"}, {"id": 227, "pytanie": "Przepisów ustawy o odpadach nie stosuje się do:", "odpowiedzi": {"a": "ścieków", "b": "produktów ubocznych pochodzenia zwierzęcego", "c": "wszystkie odpowiedzi są poprawne"}, "poprawna": "c", "komentarz": "art. 2 ustawy o odpadach"}, {"id": 228, "pytanie": "Zgłoszenie uznania przedmiotu lub substancji za produkt uboczny nie zawiera:", "odpowiedzi": {"a": "numeru identyfikacji podatkowej (NIP)", "b": "numeru REGON", "c": "opisu procesu produkcyjnego, w którym powstaje przedmiot lub substancja, i procesu, w którym zostaną one wykorzystane"}, "poprawna": "b", "komentarz": "art. 11 ust. 2 ustawy o odpadach"}, {"id": 229, "pytanie": "Co bierze się pod uwagę podczas klasyfikacji odpadów?", "odpowiedzi": {"a": "źródło powstawania odpadów", "b": "właściwości powodujące, że odpady nie są odpadami niebezpiecznymi", "c": "wszystkie odpowiedzi są błędne"}, "poprawna": "a", "komentarz": "art. 4 ust. 1 ustawy o odpadach"}, {"id": 230, "pytanie": "Najbardziej pożądane w hierarchii postępowania z odpadami działanie to:", "odpowiedzi": {"a": "recykling", "b": "przygotowanie do ponownego użycia", "c": "zapobieganie powstawaniu odpadów"}, "poprawna": "c", "komentarz": "art. 17 ust. 1 ustawy o odpadach"}, {"id": 231, "pytanie": "Magazynowanie odpadów to:", "odpowiedzi": {"a": "inaczej składowanie odpadów", "b": "to czasowe przechowywanie odpadów obejmujące m.in. tymczasowe magazynowanie odpadów przez prowadzącego zbieranie odpadów", "c": "inaczej zbieranie odpadów"}, "poprawna": "b", "komentarz": "art. 3 ust. 1 pkt 5 ustawy o odpadach"}, {"id": 232, "pytanie": "Transport odpadów:", "odpowiedzi": {"a": "wymaga uzyskania wpisu do rejestru stanowiącego integralną część Bazy danych o produktach i opakowaniach oraz o gospodarce odpadami", "b": "wymaga uzyskania zezwolenia wydawanego w drodze decyzji administracyjnej przez starostę właściwego ze względu na siedzibę prowadzonej działalności", "c": "odbywa się bez uregulowań formalnoprawnych w tym zakresie"}, "poprawna": "a", "komentarz": "art. 49 ust. 1 i art. 50 ust. 1 pkt 5 lit. b ustawy o odpadach"}, {"id": 233, "pytanie": "Ewidencję odpadów nie prowadzi się z zastosowaniem następującego dokumentu:", "odpowiedzi": {"a": "karty ewidencji komunalnych osadów ściekowych", "b": "karty ewidencji zużytych baterii i akumulatorów", "c": "karty ewidencji zużytego sprzętu elektrycznego i elektronicznego"}, "poprawna": "b", "komentarz": "art. 67 ust. 1 ustawy o odpadach"}, {"id": 234, "pytanie": "Proszę wskazać prawidłową odpowiedź:", "odpowiedzi": {"a": "zakaźne odpady medyczne unieszkodliwia się przez ich składowanie na składowiskach odpadów niebezpiecznych", "b": "zakaźne odpady medyczne unieszkodliwia się przez ich termiczne przekształcanie w spalarniach odpadów niebezpiecznych", "c": "zakaźne odpady medyczne unieszkodliwia się przez ich autoklawowanie i wytworzenie paliwa alternatywnego kierowanego do współspalarni odpadów"}, "poprawna": "b", "komentarz": "art. 95 ust. 2 ustawy o odpadach"}, {"id": 235, "pytanie": "Składowiskiem odpadów jest:", "odpowiedzi": {"a": "obiekt budowlany przeznaczony do składowania odpadów", "b": "obiekt budowlany do tymczasowego magazynowania odpadów", "c": "obiekt budowlany do zbierania odpadów"}, "poprawna": "a", "komentarz": "art. 3 ust. 1 pkt 25 ustawy o odpadach"}, {"id": 236, "pytanie": "Jaki rodzaj decyzji administracyjnych może być wydany, zgodnie z obowiązującym prawem, posiadaczowi odpadów, który zamierza prowadzić działalność w zakresie przetwarzania odpadów?", "odpowiedzi": {"a": "wyłącznie zez idłowe stosowanie komunalnych osadów ściekowych:", "odpowiedzi": {"a": "spoczywa na wytwórcy odpadów", "b": "spoczywa na władającym powierzchnią ziemi, na której komunalne osady ściekowe mają być stosowane", "c": "nie ma odpowiedzialności za komunalne osady ściekowe w przypadku ich stosowania w rolnictwie, rozumianym jako uprawa wszystkich płodów rolnych wprowadzanych do obrotu handlowego, włączając w to uprawy przeznaczane do produkcji pasz"}, "poprawna": "a", "komentarz": "art. 96 ust. 3 ustawy o odpadach"}, {"id": 241, "pytanie": "Odzysk komunalnych osadów ściekowych może polegać na stosowaniu:", "odpowiedzi": {"a": "w rolnictwie rozumianym jako uprawa wszystkich płodów rolnych wprowadzanych do obrotu handlowego, włączając w to uprawy przeznaczone do produkcji pasz", "b": "do uprawy roślin przeznaczonych do produkcji kompostu", "c": "wszystkie odpowiedzi są poprawne"}, "poprawna": "c", "komentarz": "art. 96 ust. 1 ustawy o odpadach"}, {"id": 242, "pytanie": "Podstawowe obowiązki z zakresu ochrony środowiska, które winni spełniać przedsiębiorcy prowadzący stację demontażu pojazdów wycofanych z eksploatacji wynikają z następujących przepisów prawnych:", "odpowiedzi": {"a": "ustawa z dnia 20 stycznia 2005 r. o recyklingu pojazdów wycofanych z eksploatacji i ustawa z dnia 14 grudnia 2012 r. o odpadach", "b": "ustawa z dnia 14 grudnia 2012 r. o odpadach i ustawa z dnia 20 czerwca 1997 r. Prawo o ruchu drogowym", "c": "ustawa z dnia 20 stycznia 2005 r. o recyklingu pojazdów wycofanych z eksploatacji z dnia i ustawa z dnia 20 czerwca 1997 r. Prawo o ruchu drogowym"}, "poprawna": "a", "komentarz": "art. 1 ust. 2 ustawy o recyklingu pojazdów wycofanych z eksploatacji"}, {"id": 243, "pytanie": "Jaki poziom odzysku i recyklingu odpadów pochodzących z pojazdów wycofanych z eksploatacji jest obowiązany osiągnąć przedsiębiorca prowadzący stację demontażu?", "odpowiedzi": {"a": "w wysokości odpowiednio 95% i 85% masy pojazdów przyjętych do jego stacji demontażu rocznie", "b": "w wysokości odpowiednio 75% i 65% masy pojazdów przyjętych do jego stacji demontażu rocznie", "c": "w wysokości odpowiednio 50% i 50% masy pojazdów przyjętych do jego stacji demontażu rocznie"}, "poprawna": "a", "komentarz": "art. 28 ust. 1 ustawy o recyklingu pojazdów wycofanych z eksploatacji"}, {"id": 244, "pytanie": "Który organ jest właściwy w sprawach przywozu odpadów na teren kraju, wywozu odpadów z terenu kraju i tranzytu odpadów przez teren kraju?", "odpowiedzi": {"a": "wojewódzki inspektor ochrony środowiska właściwy ze względu na miejsce przemieszczenia odpadów", "b": "minister właściwy do spraw klimatu", "c": "Główny Inspektor Ochrony Środowiska"}, "poprawna": "c", "komentarz": "art. 3 ust. 1 ustawy o międzynarodowym przemieszczaniu odpadów"}, {"id": 245, "pytanie": "Jaki przypadek należy uznać za nielegalne międzynarodowe przemieszczenie odpadów?", "odpowiedzi": {"a": "niesegregowane (zmieszane) odpady komunalne zostały wwiezione do kraju wbrew zakazowi", "b": "odpady o kodzie 16 01 17 – metale żelazne zostały wwiezione do kraju z załącznikiem Nr VII", "c": "odpady niebezpieczne zostały wwiezione na podstawie zezwolenia Głównego Inspektora Ochrony Środowiska"}, "poprawna": "a", "komentarz": "art. 11b ustawy o międzynarodowym przemieszczaniu odpadów"}, {"id": 246, "pytanie": "Wprowadzającym opakowania nie jest:", "odpowiedzi": {"a": "wytwarzający opakowania", "b": "podmiot wprowadzający produkty w opakowaniach", "c": "dokonujący wewnątrzwspólnotowego nabycia opakowań"}, "poprawna": "b", "komentarz": "art. 8 pkt 22 ustawy o gospodarce opakowaniami i odpadami opakowaniowymi"}, {"id": 247, "pytanie": "Proszę zaznaczyć prawidłowe rozwinięcie skrótu DPR:", "odpowiedzi": {"a": "dokument potwierdzający eksport odpadów opakowaniowych albo wewnątrzwspólnotową dostawę odpadów opakowaniowych w celu poddania ich recyklingowi", "b": "dokument potwierdzający inny niż recykling proces odzysku odpadów opakowaniowych, w tym określający masę tych odpadów i sposób ich odzy
